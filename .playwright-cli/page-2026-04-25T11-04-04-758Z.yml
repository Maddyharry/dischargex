                - paragraph [ref=e1311]:
                  - generic [ref=e1312]: "Diagnosis: ช่วยสรุปเคสแบบ OPD ไทยให้กระชับและใช้งานได้จริง โดยเรียงหัวข้อดังนี้ CC PI PE PHI/PMH และ U/D Investigation Diagnosis Differential diagnosis Treatment Plan และ follow-up ถ้าหัวข้อไหนไม่มีข้อมูลให้เขียนว่า 'ไม่พบข้อมูล' ให้ใส่ ICD-10 เฉพาะบรรทัดชื่อโรคใน Diagnosis และ Differential diagnosis เท่านั้น ห้ามใส่ ICD-10 ใน CC/PI/PE/PHI/Investigation/Treatment/Plan/Follow-up ข้อมูลเคสจากบทสนทนาทั้งหมดในแชทนี้ (ใช้เป็นบริบทหลัก): ผู้ใช้: opd test3: เด็กชาย 8 ปี คันซอกนิ้วมือกลางคืน มีคนในบ้านคันคล้ายกัน ไม่มีไข้ ผู้ช่วย: เข้าได้มากกับ สงสัย Scabies / หิด (ICD-10: B86) โดยมีหลักฐานสนับสนุนคือ คันมากตอนกลางคืน + ผื่น/คันบริเวณซอกนิ้วมือ + คนในบ้านคันคล้ายกัน + ไม่มีไข้ ยังควรตรวจยืนยันจากรอยโรคก่อนสรุปสุดท้าย ซักเพิ่มที่ควรถาม - คันตำแหน่งอื่นไหม: ข้อมือ รักแร้ รอบเอว ก้น อวัยวะเพศ เท้า - เห็นตุ่มแดง/ตุ่มน้ำ/รอยเกา/เส้น burrow ไหม - คนในบ้านเริ่มคันกี่คน ใครเริ่มก่อน มีการนอนร่วม/ใช้ผ้าร่วมกันไหม - เคยทายา steroid/ยาฆ่าเชื้อมาก่อนหรือไม่ - มีหนอง ปวด บวม แดง ร้อน หรือไข้ภายหลังไหม เพื่อดู secondary bacterial infection ตรวจร่างกายเพิ่ม - V/S: confirm afebrile - Skin: finger webs, wrists, elbows, axillae, waistline, buttocks, genital area, feet - Look for: burrows, erythematous papules, excoriation, crusting, impetiginization - ตรวจคนในบ้านถ้ามาด้วยจะช่วยยืนยัน pattern Dx/DDx - Working Dx: Scabies (ICD-10: B86) - DDx: - Papular urticaria / insect bite reaction (ICD-10: L28.2) - Atopic dermatitis/eczema flare (ICD-10: L20.9) - Contact dermatitis (ICD-10: L25.9) - Impetigo ถ้ามีสะเก็ดเหลือง/หนอง (ICD-10: L01.0) การตรวจเพิ่ม - ส่วนใหญ่ OPD วินิจฉัยจาก clinical ได้ - ถ้าไม่ชัด: skin scraping/mineral oil prep ดู mite/egg/scybala หรือ dermoscopy ถ้ามี การรักษาเบื้องต้น - Permethrin 5% cream ทาทั่วตัวตั้งแต่คอลงมา รวมซอกนิ้วมือ เล็บ ข้อมือ รักแร้ รอบเอว ก้น เท้า ทิ้งไว้ 8–12 ชม. แล้วล้างออก - เด็ก 8 ปี: โดยทั่วไปคอลงมา; ถ้ามีผื่นบริเวณศีรษะ/หลังหู/หน้า ค่อยพิจารณาทาบริเวณนั้นโดยหลีกเลี่ยงตา/ปาก - ทำซ้ำอีกครั้งใน 7 วัน - รักษ ผู้ช่วย: